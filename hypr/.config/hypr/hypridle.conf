general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  #after_sleep_cmd = hyprctl dispatch dpms on && dark-side-of-the-monitor on
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
listener {
  timeout = 300
  on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
  #on-timeout = hyprctl dispatch dpms off && dark-side-of-the-monitor off
  #on-resume = hyprctl dispatch dpms on && dark-side-of-the-monitor on
}
listener {
  timeout = 14400
  on-timeout = loginctl lock-session
}
# lid-switch suspend moved to bindings.lua (hl.bind "switch:on:Lid Switch"),
# hypridle 0.1.8 has no listener:event config option.
